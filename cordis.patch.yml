# cc-computer-use MCP bundle：只做一件事 —— 插入一行 Host 插件，
# 用 stdio 把本地已打包的 cc-computer-use MCP server 挂到模型工具表里。
#
# 说明（为什么这么写）：
# - serverName 是**本地命名空间**，决定模型看到的工具名：
#   mcp__cc-computer-use__<原工具名>，例如 mcp__cc-computer-use__get_ui_tree。
#   `-` 在 DeepSeek 函数名契约内，不会被哈希改名。
#   与cc-computer-use 项目 README 的告警保持一致（服务名要用 cc-computer-use，不能用 computer-use）。
# - 用 dist/ 里的冻结产物（PyInstaller onedir + 薄 wrapper），所以**不需要 conda 在 PATH 里**。
# - env 叠加在「已清洗的进程环境」之上；清洗只剔除 KEY/PASSWORD/SECRET/TOKEN 形状的
#   变量与全部 DSH_*，PATH/HOME/locale/DISPLAY 都会保留。这里显式写出的两项是**声明依赖**，
#   缺了就会以可见的方式失败，而不是变成难查的怪现象。
- insert:
    - id: mcp-cc-computer-use
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cc-computer-use
        transport: stdio
        # 必填：cc-computer-use 冻结产物的绝对路径（<仓库目录>/dist/computer-use-mcp）。
        command: /home/liufei/data/claude-workspace/cc-computer-use/dist/computer-use-mcp
        args: []
        env:
          # server 子进程必须继承 X11 display 才能读屏/注入（cc-computer-use 项目 README 的硬前提）。
          # 用 !!js 引用宿主已有值，而不是写死 :1 —— 换 display 或换机器都不用改。
          DISPLAY: !!js process.env.DISPLAY
          # 防 ~/.local 下的包遮蔽冻结产物内的依赖（cc-computer-use 项目 README 要求每条命令都带）
          PYTHONNOUSERSITE: '1'
        # 起不来就拒绝激活：宁可启动时炸一次，也不要「工具表悄悄少了一堆工具」
        failOnStartupError: true
